% rebase('base.html', title='Pantalla')
<h2><svg class="i"><use href="#i-monitor"/></svg>Pantalla</h2>
<p class="sub">Cómo se ve la pantalla de la radio: las mismas opciones que Ajustes &rarr; Pantalla, se aplican en la radio al cambiarlas.</p>

<style>
.dp-grid{columns:2 430px;column-gap:18px}
/* cards, rows, switches, segmented buttons and ranges are in base.css */
/* S-meter preview */
.prev{display:flex;justify-content:center;padding:14px 20px 4px}
.prev svg{width:260px;max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
.dp-foot{display:flex;align-items:center;gap:10px;margin-top:6px;min-height:24px}
.col{display:flex;align-items:center;gap:8px}
.col input[type=color]{width:38px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.col input[type=color]:disabled{opacity:.35}
</style>

<div class="dp-foot"><span class="status" id="status" style="margin-left:0"></span></div>
<div class="dp-grid" id="cards"></div>

<script>
const ICONS = {
  look: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2a10 10 0 1 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A5.6 5.6 0 0 0 22 9.8C22 5.5 17.5 2 12 2z"/></svg>',
  meter: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15a9 9 0 0 1 18 0"/><path d="M12 15l4-5"/><circle cx="12" cy="15" r="1.4"/><path d="M5.6 9.6l1 1M18.4 9.6l-1 1M12 6v1.4"/></svg>',
  wf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8v8M10 10v6M13 7v9M16 11v5"/></svg>',
  layers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  text: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg>'
};

/* [icon, title, note, rows]; row: [name, label, hint, kind, extra]
 * kind: sw (on/off), seg (labels), sel (labels), range ([min, max, step, scale, unit]), theme,
 * color (0xRRGGBB, -1 the theme's; extra: the label of -1) */
const CARDS = [
  ["look", "Tema", "Colores, botones y fuentes de todas las pantallas", [
    ["theme", "Tema", "La pantalla de la radio se reinicia con el nuevo", "theme"]]],
  ["meter", "S-meter", "El medidor de señal de la barra de arriba", [
    ["smeter_needle", "Tipo de S-meter", "Barras, o una aguja en un cuadrante", "seg", ["Barras", "Aguja"]],
    ["smeter_color", "Colores", "El tema tal cual, o verde → amarillo → rojo a lo largo de la escala o con la señal", "seg", ["Tema", "Escala", "Nivel"]],
    ["smeter_lamp", "Luz de la aguja", "Un cuadrante ámbar iluminado por detrás, como los medidores analógicos", "sw"],
    ["smeter_bar_color", "Color del medidor", "Con los colores del tema: las barras o la escala de la aguja hasta S9", "color", "Tema"],
    ["swr_color", "Color de ROE", "La barra de ROE al transmitir; el amarillo y rojo arriba de 2 y 3 quedan", "color", "Tema"]], "preview"],
  ["wf", "Espectro y cascada", "Cómo se mueve y se lee la cascada", [
    ["spectrum_show", "Espectro", "El espectro arriba de la cascada; la pantalla de la radio se reinicia", "sw"],
    ["spectrum_filled", "Relleno del espectro", "El área bajo la traza rellena", "sw"],
    ["spectrum_peak", "Picos del espectro", "Los picos retenidos un momento", "sw"],
    ["spectrum_height", "Altura del espectro", "Espectro más alto, cascada más baja; la pantalla de la radio se reinicia", "range", [60, 160, 4, 1, " px"]],
    ["spectrum_line_color", "Color de la traza", "El del tema, o uno propio", "color", "Tema"],
    ["spectrum_fill_color", "Color del relleno", "Como la traza, o uno propio", "color", "Como la traza"],
    ["spectrum_fill_gradient", "Relleno degradado", "El relleno se desvanece hacia abajo", "sw"],
    ["wf_palette", "Colores de la cascada", "Los del tema, o uno de estos", "sel", ["Tema", "Clásico", "Gauss", "Gris", "Fuego", "Hielo", "Arco iris"]],
    ["wf_mode", "Modo", "Centrada deja el VFO en el medio, Fija mantiene el ancho", "seg", ["Centrada", "Fija"]],
    ["wf_speed", "Velocidad", "Líneas por segundo, de lento a rápido", "range", [1, 5, 1, 1, ""]],
    ["auto_level", "Nivel automático", "Sigue el piso de ruido solo", "sw"],
    ["auto_level_offset", "Ajuste del nivel automático", "Más oscuro o más claro que el ruido", "range", [-150, 150, 5, 10, " dB"]],
    ["wf_center_line", "Línea central", "Una línea en el VFO", "sw"],
    ["wf_zoom", "Zoom", "Zoom con la cascada en lugar del ancho", "sw"],
    ["wf_smooth", "Desplazamiento suave", "Se mueve por píxeles en lugar de líneas", "sw"]]],
  ["layers", "Sobre la cascada", "Lo que se dibuja encima", [
    ["band_plan", "Plan de bandas", "Los segmentos IARU arriba", "sw"],
    ["cluster_spots_wf", "Spots del cluster", "Los indicativos en sus frecuencias", "sw"],
    ["cluster_column", "Columna del cluster", "La lista de spots a la derecha", "sw"]]],
  ["sun", "Iluminación", "Luz de pantalla y botones", [
    ["bright_normal", "Brillo", "", "range", [-1, 9, 1, 1, ""]],
    ["bright_idle", "Brillo en reposo", "", "range", [-1, 9, 1, 1, ""]],
    ["bright_timeout", "Reposo después de", "Segundos sin tocar teclas ni perillas", "range", [5, 120, 5, 1, " s"]],
    ["bright_buttons", "Luz de botones", "", "sel", ["Siempre apagada", "Siempre encendida", "Encendida un rato"]]]],
  ["text", "Texto e info", "Lo que la pantalla muestra más grande", [
    ["knob_info", "Info de perillas", "El valor que se ve al girar una perilla", "sw"],
    ["digi_text_compact", "Texto decodificado", "Texto de CW y RTTY: grande, o compacto con más líneas", "seg", ["Grande", "Compacto"]],
    ["mag_freq", "Ampliar frecuencia", "Frecuencia grande al sintonizar", "sw"],
    ["mag_info", "Ampliar info", "Valor grande del control que se cambia", "sw"],
    ["mag_alc", "Ampliar ALC", "Lectura de ALC grande al transmitir", "sw"]]]
];

let D = {};

var showStatus = function(text, error=false) {
  const el = $("#status");
  el.toggleClass("error", error);
  el.html('<span class="dot"></span>').append(document.createTextNode(text));
}

var send = function(payload, done) {
  $.ajax({
    url: "/api/display", type: "POST", data: JSON.stringify(payload),
    contentType: "application/json; charset=utf-8", dataType: "json",
    success: function() {
      showStatus(payload.name === "theme" ? "Tema elegido: la pantalla de la radio se reinicia" : "Guardado en la radio");
      if (done) done();
    },
    error: function(xhr) { showStatus(xhr.responseJSON ? xhr.responseJSON.msg : "Not saved", true); }
  });
}

var setVal = function(name, v) {
  D[name] = v;
  send({name: name, val: v});
  refresh();
}

var control = function(o) {
  const name = o[0], kind = o[3], extra = o[4], id = "opt-" + name;
  if (kind === "sw") {
    const box = $("<label class='sw'>").attr("title", o[1]);
    $("<input type='checkbox' role='switch'>").attr({id: id, "aria-label": o[1]}).prop("checked", !!D[name])
      .on("change", function() { setVal(name, this.checked ? 1 : 0); }).appendTo(box);
    return box.append("<i></i>");
  }
  if (kind === "seg") {
    const seg = $("<div class='seg' role='group'>").attr("aria-label", o[1]);
    extra.forEach(function(t, i) {
      $("<button type='button'>").text(t).attr("aria-pressed", D[name] === i ? "true" : "false")
        .on("click", function() { seg.children().attr("aria-pressed", "false"); $(this).attr("aria-pressed", "true"); setVal(name, i); })
        .appendTo(seg);
    });
    return seg;
  }
  if (kind === "color") {
    const own = D[name] >= 0, hex = function(v) { return "#" + ("00000" + v.toString(16)).slice(-6); };
    const pick = $("<input type='color'>").attr({id: id, "aria-label": o[1]}).val(own ? hex(D[name]) : "#40c0ff")
      .prop("disabled", !own).on("change", function() { setVal(name, parseInt(this.value.slice(1), 16)); });
    const seg = $("<div class='seg' role='group'>").attr("aria-label", o[1]);
    [extra, "Own"].forEach(function(t, i) {
      $("<button type='button'>").text(t).attr("aria-pressed", (i === 1) === own ? "true" : "false")
        .on("click", function() {
          seg.children().attr("aria-pressed", "false"); $(this).attr("aria-pressed", "true");
          pick.prop("disabled", i === 0);
          setVal(name, i === 0 ? -1 : parseInt(pick.val().slice(1), 16));
        }).appendTo(seg);
    });
    return $("<div class='col'>").append(seg, pick);
  }
  if (kind === "sel" || kind === "theme") {
    const sel = $("<select>").attr({id: id, "aria-label": o[1]});
    (kind === "theme" ? D.themes : extra).forEach(function(t, i) { sel.append($("<option>").val(kind === "theme" ? t : i).text(t)); });
    sel.val(kind === "theme" ? D.theme : D[name]);
    return sel.on("change", function() {
      if (kind === "theme") send({name: "theme", theme: this.value});
      else setVal(name, parseInt(this.value, 10));
    });
  }
  const [min, max, step, scale, unit] = extra;
  const out = $("<output>"), show = function(v) { out.text((scale === 1 ? v : (v / scale).toFixed(1)) + unit); };
  const r = $("<input type='range'>").attr({id: id, min: min, max: max, step: step, "aria-label": o[1]}).val(D[name]);
  show(D[name]);
  r.on("input", function() { show(this.value); }).on("change", function() { setVal(name, parseInt(this.value, 10)); });
  return $("<div class='rng'>").append(r, out);
}

/* A small S-meter, as the radio draws it with these choices (IU1WXY colours) */
var preview = function() {
  const needle = D.smeter_needle === 1, lamp = needle && D.smeter_lamp === 1, col = lamp ? 0 : D.smeter_color || 0, lvl = 0.6;
  const ok = [136, 255, 136], warn = [255, 176, 64], tx = [255, 64, 64];
  const own = D.smeter_bar_color >= 0 ? "#" + ("00000" + D.smeter_bar_color.toString(16)).slice(-6) : "#aaaaaa";
  const mix = function(a, b, t) { return "rgb(" + a.map(function(v, i) { return Math.round(v + (b[i] - v) * t); }) + ")"; };
  const ramp = function(u) { return u < .5 ? mix(ok, warn, u * 2) : mix(warn, tx, (u - .5) * 2); };
  let s = '<svg viewBox="0 0 260 70" role="img" aria-label="S-meter preview"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3f47"/><stop offset="1" stop-color="#23272d"/></linearGradient></defs><radialGradient id="pl" cx="50%" cy="110%" r="90%"><stop offset="0" stop-color="#ffe2a8"/><stop offset=".55" stop-color="#e0a048"/><stop offset="1" stop-color="#9a5e1c"/></radialGradient><rect width="260" height="70" fill="url(#' + (lamp ? "pl" : "pg") + ')"/>';
  if (needle) {
    const R = 198, CX = 130, CY = 24 + R, A0 = -32, A1 = 32;
    const pt = function(a, r) { const t = a * Math.PI / 180; return [CX + r * Math.sin(t), CY - r * Math.cos(t)]; };
    for (let k = 0; k < 32; k++) {
      const u = (k + .5) / 32, a = A0 + 64 * k / 32, b = A0 + 64 * (k + 1) / 32, p = pt(a, R), q = pt(b, R);
      const c = col === 1 ? ramp(u) : col === 2 ? (u <= lvl ? ramp(lvl) : "#555a62") : lamp ? (u < .7 ? "#1a1006" : "#b01e10") : (u < .7 ? own : "#e02020");
      s += '<path d="M' + p[0] + ' ' + p[1] + ' A' + R + ' ' + R + ' 0 0 1 ' + q[0] + ' ' + q[1] + '" stroke="' + c + '" stroke-width="' + (u < .7 ? 3 : 5) + '" fill="none"/>';
    }
    [["S1", 0], ["3", .175], ["5", .35], ["7", .525], ["9", .7], ["+20", .85], ["+40", 1]].forEach(function(l) {
      const p = pt(A0 + 64 * l[1], R + 13);
      s += '<text x="' + p[0] + '" y="' + (p[1] + 5) + '" fill="' + (lamp ? (l[1] > .7 ? "#b01e10" : "#1a1006") : "#ffffff") + '" font-size="14" text-anchor="middle" font-family="system-ui">' + l[0] + '</text>';
    });
    const t = pt(A0 + 64 * lvl, R + 2);
    s += '<line x1="' + CX + '" y1="' + CY + '" x2="' + t[0] + '" y2="' + t[1] + '" stroke="' + (lamp ? "#1a1006" : col ? "#ffffff" : "#ff4040") + '" stroke-width="4" stroke-linecap="round"/>';
  } else {
    const n = 25, sw = (260 - 38) / (n - 1), bw = sw * .55;
    for (let i = 0; i < n; i++) {
      const u = i / (n - 1);
      if (u > lvl) break;
      const c = col === 1 ? ramp(u) : col === 2 ? ramp(lvl) : (u < .66 ? own : mix([32, 192, 64], [224, 32, 32], (u - .66) / .34));
      s += '<rect x="' + (16 + i * sw - bw / 2) + '" y="6" width="' + bw + '" height="37" fill="' + c + '"/>';
    }
    [["S1", 0], ["3", 4], ["5", 8], ["7", 12], ["9", 16], ["+20", 20], ["+40", 24]].forEach(function(l) {
      s += '<text x="' + (16 + l[1] * sw) + '" y="27" fill="#fff" font-size="14" text-anchor="middle" font-family="system-ui" stroke="#30353c" stroke-width="3" paint-order="stroke">' + l[0] + '</text>';
    });
  }
  return s + '</svg>';
}

/* Rows that only matter with another option on */
var refresh = function() {
  $("#row-auto_level_offset").toggleClass("off", !D.auto_level);
  $("#row-spectrum_filled, #row-spectrum_peak, #row-spectrum_height, #row-spectrum_line_color").toggleClass("off", !D.spectrum_show);
  $("#row-spectrum_fill_color, #row-spectrum_fill_gradient").toggleClass("off", !D.spectrum_show || !D.spectrum_filled);
  $("#row-smeter_bar_color").toggleClass("off", D.smeter_color !== 0 || (D.smeter_needle === 1 && D.smeter_lamp === 1));
  $("#row-smeter_lamp").toggleClass("off", D.smeter_needle !== 1);
  $("#row-smeter_color").toggleClass("off", D.smeter_needle === 1 && D.smeter_lamp === 1);
  $("#prev").html(preview());
}

var render = function() {
  const cards = $("#cards").empty();
  CARDS.forEach(function(c) {
    const card = $("<section class='dp-card'>");
    const head = $("<div class='dp-head'>").append($("<div class='dp-ico' aria-hidden='true'>").html(ICONS[c[0]]),
      $("<div>").append($("<h3>").text(c[1]), $("<p>").text(c[2])));
    card.append(head);
    if (c[4] === "preview") card.append($("<div class='prev' id='prev'>"));
    c[3].forEach(function(o) {
      const lbl = $("<div class='dp-lbl'>").append($("<b>").text(o[1]));
      if (o[2]) lbl.append($("<span>").text(o[2]));
      card.append($("<div class='dp-row'>").attr("id", "row-" + o[0]).append(lbl, $("<div class='dp-ctl'>").append(control(o))));
    });
    cards.append(card);
  });
  refresh();
  showStatus("Leído de la radio");
}

$.ajax({url: "/api/display", dataType: "json", success: function(d) { D = d; render(); },
  error: function(xhr) { showStatus(xhr.responseJSON ? xhr.responseJSON.msg : "La radio no responde", true); }});
</script>
