name: Build image
# By hand only (Actions > Build image > Run workflow): the releases are built locally with the image
# attached, a run on every tag only added a second copy (and took 2 h, failing at times)
on:
  workflow_dispatch:

# The repo's default token is read-only; the Release step needs to create
# the release and attach the image.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: false

        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: true
    - name: check free space
      run: |
        df -h
        pwd
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout GUI
      uses: actions/checkout@v4
      with:
        submodules: true
        path: x6100_gui

    - name: Checkout buildroot
      uses: actions/checkout@v4
      with:
        submodules: true
        repository: gdyuldin/AetherX6100Buildroot
        path: AetherX6100Buildroot

    - name: Patch GUI mk
      run: |
        sed -i "s,https://github.com/gdyuldin/x6100_gui,${GITHUB_WORKSPACE}/x6100_gui,g" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk
        sed -i "s,^X6100_GUI_SITE_METHOD = git,X6100_GUI_SITE_METHOD = local,g" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk
        sed -i "s,^X6100_GUI_GIT_SUBMODULES,# X6100_GUI_GIT_SUBMODULES,g" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk

    # Web configurator: build the copy vendored in webserver/ instead of
    # fetching gdyuldin/x6100_webserver from GitHub.
    - name: Patch webserver mk
      run: |
        sed -i "s,^X6100_WEBSERVER_SITE = .*,X6100_WEBSERVER_SITE = ${GITHUB_WORKSPACE}/x6100_gui/webserver,g" AetherX6100Buildroot/br2_external/package/x6100-webserver/x6100_webserver.mk
        sed -i "s,^X6100_WEBSERVER_SITE_METHOD = git,X6100_WEBSERVER_SITE_METHOD = local,g" AetherX6100Buildroot/br2_external/package/x6100-webserver/x6100_webserver.mk
        grep "^X6100_WEBSERVER_SITE" AetherX6100Buildroot/br2_external/package/x6100-webserver/x6100_webserver.mk

    # JS8 (third-party/js8core) needs Boost headers and single-precision FFTW
    # (buildroot package fftw-single, already built for liquid-dsp). Boost
    # with no libraries selected installs headers only.
    - name: Enable JS8 dependencies
      run: |
        sed -i "s,^X6100_GUI_DEPENDENCIES = \(.*\)$,X6100_GUI_DEPENDENCIES = \1 boost fftw-single," AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk
        echo "BR2_PACKAGE_BOOST=y" >> AetherX6100Buildroot/br2_external/configs/X6100_defconfig
        # Root certificates: x6100-field talks HTTPS to POTA and QRZ
        echo "BR2_PACKAGE_CA_CERTIFICATES=y" >> AetherX6100Buildroot/br2_external/configs/X6100_defconfig
        # Python sin SSL no abre https ("unknown url type: https"): Actualizar lista, spots POTA, QRZ
        echo "BR2_PACKAGE_PYTHON3_SSL=y" >> AetherX6100Buildroot/br2_external/configs/X6100_defconfig
        # The display runs on DRM (lv_drivers/display/drm.c); libdrm is already in the defconfig
        sed -i "/^X6100_GUI_DEPENDENCIES/s/$/ libdrm/" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk
        grep "^X6100_GUI_DEPENDENCIES" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk

    # The GUI has no voice guidance (text-to-speech): drop RHVoice and its
    # voices from the image. RHVoice was the only package pulling in
    # PulseAudio, which the GUI still needs, so the GUI selects it instead.
    - name: Drop RHVoice
      run: |
        sed -i "/^X6100_GUI_DEPENDENCIES/s/\brhvoice\b/pulseaudio/" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk
        sed -i "s/select BR2_PACKAGE_RHVOICE$/select BR2_PACKAGE_PULSEAUDIO/" AetherX6100Buildroot/br2_external/package/x6100-gui/Config.in
        sed -i "/^BR2_PACKAGE_RHVOICE/d" AetherX6100Buildroot/br2_external/configs/X6100_defconfig
        grep "^X6100_GUI_DEPENDENCIES" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk
        ! grep -in "rhvoice" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk AetherX6100Buildroot/br2_external/package/x6100-gui/Config.in AetherX6100Buildroot/br2_external/configs/X6100_defconfig

    # System cleanup:
    # - firmware for PCI/PCIe network cards (the A33 has no PCIe); the USB
    #   Ethernet adapters' firmware (RTL815x) stays;
    # - PulseAudio at the GUI rate, 44.1 kHz: the radio audio is not resampled;
    # - one Bluetooth setup: bt_start.sh (udev) defers to btcat-setup.
    - name: System cleanup
      run: |
        B=AetherX6100Buildroot/br2_external
        for o in BROADCOM_TIGON3 BNX2X CXGB4_T4 CXGB4_T5 INTEL_E100 INTEL_ICE MICROCHIP_VSC85XX_PHY QLOGIC_4X RTL_8169; do
          sed -i "/^BR2_PACKAGE_LINUX_FIRMWARE_${o}=y/d" $B/configs/X6100_defconfig
        done
        sed -i "s/^default-sample-rate = 48000/default-sample-rate = 44100/" $B/board/X6100/linux/rootfs-overlay/etc/pulse/daemon.conf
        cp x6100_gui/buildroot/bt_start.sh $B/board/X6100/linux/rootfs-overlay/usr/bin/bt_start.sh
        grep "^BR2_PACKAGE_LINUX_FIRMWARE" $B/configs/X6100_defconfig
        grep -q "^default-sample-rate = 44100" $B/board/X6100/linux/rootfs-overlay/etc/pulse/daemon.conf

    # Boot logo: the kernel's framebuffer logo shown at power on (800x480,
    # reduced to 224 colours by buildroot).
    - name: Kernel UHID (Bluetooth Low Energy keyboards)
      run: |
        D=AetherX6100Buildroot/br2_external/board/X6100/linux/sun8i-r16-x6100_defconfig
        grep -q "^CONFIG_UHID=" $D || echo "CONFIG_UHID=m" >> $D

    # Punto de acceso WiFi (x6100-hotspot): DHCP para la PC que se conecta
    # directo a la radio, sin router
    - name: Hotspot DHCP server
      run: |
        echo "BR2_PACKAGE_DNSMASQ=y" >> AetherX6100Buildroot/br2_external/configs/X6100_defconfig
        # Antes que la GUI: su rootfs/etc/init.d/S80dnsmasq deja apagado el dnsmasq general
        sed -i "/^X6100_GUI_DEPENDENCIES/s/$/ dnsmasq/" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk
        grep "^X6100_GUI_DEPENDENCIES" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk
        grep "^BR2_PACKAGE_DNSMASQ" AetherX6100Buildroot/br2_external/configs/X6100_defconfig

    # Operación de campo: la imagen trae las listas POTA/SOTA/WWBOTA/HOTA (la radio las copia a
    # /mnt/field la primera vez, sin WiFi). Si un sitio no responde, la radio la baja después.
    - name: Field Ops reference lists
      run: |
        D=x6100_gui/rootfs/usr/share/x6100-field
        mkdir -p $D
        if X6100_FIELD_DIR=$PWD/fieldrefs timeout 900 python3 x6100_gui/rootfs/usr/sbin/x6100-field update --call CX8ANM; then
          gzip -9c fieldrefs/refs.tsv > $D/refs.tsv.gz
          rm -rf fieldrefs
          ls -l $D/refs.tsv.gz
          cut -c1 fieldrefs/refs.tsv | sort | uniq -c
        else
          echo "::warning::No se pudieron bajar las listas de referencias; la radio las baja con WiFi"
          rmdir $D || true
        fi

    - name: Custom boot logo
      run: |
        cp x6100_gui/boot/logo.png AetherX6100Buildroot/br2_external/board/X6100/linux/logo.png

    # Ccache
    - name: Prepare ccache timestamp
      id: ccache_cache_timestamp
      shell: cmake -P {0}
      run: |
        string(TIMESTAMP current_date "%Y-%m-%d-%H;%M;%S" UTC)
        file(APPEND "$ENV{GITHUB_OUTPUT}" "timestamp=${current_date}")

    # Restore here and save right after Build, even when Build fails, so a
    # failed attempt still leaves its compiled work for the next one.
    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: ~/.buildroot-ccache
        key: ${{ runner.os }}-ccache-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    # Versión CX8ANM: la del archivo + el número de esta ejecución (1.0.7, 1.0.8...)
    - name: CX8ANM version
      run: |
        V="$(tr -d ' \n' < x6100_gui/VERSION_CX8ANM).${{ github.run_number }}"
        echo "$V" > x6100_gui/VERSION_CX8ANM
        echo "CX8ANM_VERSION=$V" >> "$GITHUB_ENV"
        echo "IMG=Xiegu_X6100-CX8ANM_v$V" >> "$GITHUB_ENV"
        echo "Imagen: Xiegu_X6100-CX8ANM_v$V"

    # Configure
    - name: Configure
      run: |
        cd AetherX6100Buildroot && bash ./br_config.sh

    # Build
    - name: Build
      run: |
        cd AetherX6100Buildroot/build
        make lame mpg123
        make libsndfile-dirclean
        set -o pipefail
        make 2>&1 | tee $GITHUB_WORKSPACE/build.log

    # Si la compilación falla: el error, a la vista en el resumen de la ejecución
    - name: Show build error
      if: failure()
      run: |
        L=$GITHUB_WORKSPACE/build.log
        [ -f $L ] || exit 0
        { df -h / | tail -1
          grep -niE "rsync|No space|Permission denied|cannot |\*\*\*|undefined reference" $L | tail -20
          echo ----; tail -25 $L; } | cut -c1-240 > err.txt
        { echo '### Error de compilación'; echo '```'; cat err.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
        msg=$(sed 's/%/%25/g' err.txt | awk '{printf "%s%%0A", $0}')
        echo "::error title=Build::$msg"

    - name: Save ccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ~/.buildroot-ccache
        key: ${{ runner.os }}-ccache-${{ steps.ccache_cache_timestamp.outputs.timestamp }}

    # Replace U-boot
    - name: Replace u-boot
      run: |
        dd if=x6100_gui/u-boot/u-boot-sunxi-with-spl.bin of=AetherX6100Buildroot/build/images/sdcard.img seek=8K bs=1 conv=notrunc

    # Compress image
    - name: Compress image
      run: |
        cd AetherX6100Buildroot/build/images
        mv sdcard.img ${{ env.IMG }}.img
        zip ${{ env.IMG }}.img.zip ${{ env.IMG }}.img

    # Always keep the image as a workflow artifact: branch runs have no
    # release to attach to, and on a tag it survives a failed Release step.
    - name: Upload image
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.IMG }}.img.zip
        path: AetherX6100Buildroot/build/images/${{ env.IMG }}.img.zip
        retention-days: 30

    # Create release
    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: AetherX6100Buildroot/build/images/${{ env.IMG }}.img.zip
